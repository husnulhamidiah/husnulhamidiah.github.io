baseURL = 'https://husnulhamidiah.github.io'
languageCode = 'en-us'
title = 'ho͝osnul'
theme = 'typo'

[taxonomies]
tag = 'tags'

[params]
# Home meta description
description = "A personal blog curated by Husnul Anwari."

# Appearance settings
theme = 'light'
colorPalette = 'default'
hideHeader = false

# Intro on main page, content in markdown
homeIntroTitle = 'Hi!'
homeIntroContent = """
I am an Indonesian software engineer. I enjoy tinkering with ideas and turning them into code, constantly exploring new ways to build and improve systems. 
I’m interested in writing and photography. Oh I like art, even if I’m pretty bad at it. \\
Feel free to read [about myself](/about) or to look at my [posts](/posts).
"""

singleDateFormat = '2 Jan 2006'

# Collection to display on home
# homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 10
listSummaries = false
listDateFormat = '02 Jan 2006'

# Footer
showFooter = false

# Breadcrumbs
[params.breadcrumbs]
enabled = false
showCurrentPage = true
home = "~"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/husnul-anwari/"

[[params.social]]
name = "github"
url = "https://github.com/husnulhamidiah"

[[params.social]]
name = "instagram"
url = "https://www.instagram.com/analogsaurus/"

# [[params.social]]
# name = "leetcode"
# url = "https://leetcode.com/u/tomfran/"

# Main menu pages
# [[params.menu]]
# name = "home"
# url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "about"
url = "/about"

[[params.menu]]
name = "library"
url = "/library"

# [[params.menu]]
# name = "tags"
# url = "/tags"


# Syntax highlight on code blocks
[markup]
[markup.highlight]
noClasses = false

# Deploy settings

[[deployment.matchers]]
pattern = "^.+\\.(js|css|svg|ttf|woff2)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg|gif|webp)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = false

[params.umami]
enable = false
jsLocation = "https://cloud.umami.is/script.js"
websiteId = "your website id"